name: build-probe
on:
  workflow_dispatch:
  push:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore folders
        run: |
          for f in *__*; do n="${f//__//}"; mkdir -p "$(dirname "$n")"; mv "$f" "$n"; done
          rm -f build.yml
          ls -R | head -50
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Android SDK/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Compile shaders
        run: |
          G=$ANDROID_SDK_ROOT/ndk/27.2.12479018/shader-tools/linux-x86_64/glslc
          A=app/src/main/assets
          mkdir -p $A
          $G --target-env=vulkan1.1 shaders/tri.vert -o $A/tri_vert.spv
          $G --target-env=vulkan1.1 shaders/tri.frag -o $A/tri_frag.spv
          $G --target-env=vulkan1.2 --target-spv=spv1.5 shaders/tri.frag -o $A/tri_frag_spv15.spv
          $G --target-env=vulkan1.1 shaders/vin.vert -o $A/vin_vert.spv
          $G --target-env=vulkan1.2 shaders/i64.frag -o $A/i64_frag.spv
          $G --target-env=vulkan1.2 shaders/i16.frag -o $A/i16_frag.spv
          $G --target-env=vulkan1.2 shaders/bda.frag -o $A/bda_frag.spv
          $G --target-env=vulkan1.1 shaders/comp.comp -o $A/comp.spv
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: g52probe-apk
          path: app/build/outputs/apk/debug/app-debug.apk
